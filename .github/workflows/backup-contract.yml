name: Backup data contract

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/db/backup*.ts'
      - 'src/db/database.ts'
      - '.github/workflows/backup-contract.yml'
  push:
    branches: [master]
    paths:
      - 'src/db/backup*.ts'
      - 'src/db/database.ts'
      - '.github/workflows/backup-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and backup format tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run src/db/backupFormat.test.ts
